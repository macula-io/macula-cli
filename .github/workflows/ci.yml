name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      # No unit tests: every command in this repo talks to a live
      # macula-station by design (it's a diagnostic tool for the real
      # mesh, not a library), so there's nothing meaningful to unit
      # test in isolation. Live/manual verification is documented in
      # the README's "Verifying a change" section — same convention
      # macula-go-sdk uses for its own `live`-tagged tests, just with
      # no offline half to run in CI at all.
