version: 2

project_name: macula-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: macula-cli
    main: ./cmd/macula-cli
    binary: macula-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: macula-cli
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE-APACHE
      - LICENSE-MIT

checksum:
  name_template: "checksums.txt"

changelog:
  # No commit-message convention is enforced in this repo yet (see
  # CHANGELOG.md's own absence org-wide, per workspace memory) --
  # GoReleaser's default log-of-commits is more honest than a curated
  # changelog this repo doesn't actually maintain.
  sort: asc

release:
  github:
    owner: macula-io
    name: macula-cli
