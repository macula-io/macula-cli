version: 2

project_name: macula-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: macula-cli
    main: ./cmd/macula-cli
    binary: macula-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: macula-cli
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE-APACHE
      - LICENSE-MIT

checksum:
  name_template: "checksums.txt"

changelog:
  # The release notes are goreleaser's commit log. They sit beside
  # CHANGELOG.md, which is kept by hand in Keep a Changelog form and is the
  # history a reader is pointed at; this is the per-commit detail.
  sort: asc

release:
  github:
    owner: macula-io
    name: macula-cli
